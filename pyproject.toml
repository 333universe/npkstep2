[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "npkmath"
version = "0.3.0"
description = "NPKmath: verified-claim signals for AI systems"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["npkmath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
